<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Set the page character encoding and mobile viewport. -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Set the browser tab title and load the stylesheet. -->
  <title>Fuel Money? 😂</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Main content card. -->
  <main class="card">
    <!-- Floating laughing emoji. -->
    <div class="emoji" aria-hidden="true">😂</div>

    <!-- Animated message text. -->
    <section class="message" aria-labelledby="main-message">
      <h1 id="main-message">Send me ₦2,000 make I take buy fuel drive come your house. 😁⛽</h1>
      <p>No pressure o... but fuel no dey cheap. 😂</p>
    </section>

    <!-- Button that triggers the playful popup. -->
    <button class="consider-button" id="consider-button" type="button">
      Abeg Consider Am 😂
    </button>

    <!-- Popup message, announced to screen readers when shown. -->
    <p class="popup" id="popup" role="status" aria-live="polite" hidden>
      😂 Na cruise! I just wan see who go really send am.
    </p>
  </main>

  <!-- Load the page interaction script. -->
  <script src="script.js"></script>
</body>
</html>
